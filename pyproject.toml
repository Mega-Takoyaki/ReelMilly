[project]
name = "reelmilly"
version = "0.1.0"
description = "画像・動画管理を中核に据えたアセット管理アプリ"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    # 画像・動画のプロパティ表示(解像度・長さ等)や将来のサムネイル生成で使う
    # コア機能のため、NSFW仕分け専用ではなくベース依存関係とする
    "pillow",
    "opencv-python-headless",
]

[project.optional-dependencies]
# torch/timmはNSFW自動仕分け専用。重量級のためオプション化する
nsfw = [
    "torch",
    "timm",
]
# ai: 画像内容説明・Fanvue投稿文生成(ADR-0015)。既定プロバイダーのClaude API用SDK。
# OpenAI APIを使う場合は別途 `pip install openai` する(README参照)
ai = [
    "anthropic",
]
# devはCIで使う。torch/timmは重量級のため意図的に含めない
# (test_nsfw.pyはモデル推論部分をモックしてテストする)
# anthropicは軽量なためdevに含め、core/generation.pyをモックでテストする
dev = [
    "pytest",
    "numpy",
    "anthropic",
]

[project.scripts]
reelmilly = "core.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
core = ["schema.sql", "web/templates/*.html", "web/static/*.css", "web/static/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
