timezone: Asia/Tokyo

paths:
  library_root: data/library
  state_dir: data/state
  screenshots_dir: data/screenshots

nsfw:
  model: marqo/nsfw-image-detection-384
  threshold: 0.5
  video_frame_interval_seconds: 2

platform_content_rules:
  fanvue: [sfw, suggestive, explicit]
  x: [sfw, suggestive, explicit]
  instagram: [sfw]

platform_auto_post_ratings:
  fanvue: [sfw, suggestive, explicit]
  x: [sfw]

web:
  host: 127.0.0.1
  port: 8420

# `reelmilly run-due`/`reelmilly watch`が参照する、各ジョブの実行予定時刻(HH:MM、上記timezone基準)。
# 指定時刻を過ぎていて当日未実行なら実行する。未設定のジョブ名はrun-due/watchの対象外。
cadence:
  drop: "21:00"
